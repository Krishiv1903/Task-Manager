services:
  - type: web
    name: task-manager-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_INVITE_TOKEN
        sync: false
      - key: CLIENT_URL
        sync: false
